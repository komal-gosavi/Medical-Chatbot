services:
  - type: web
    name: medical-chatbot
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: "10000"
      - key: PINECONE_API_KEY
        scope: secret
      - key: OPENAI_API_KEY
        scope: secret
